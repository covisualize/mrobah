<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themes | MrObah</title>
  <meta
    name="description"
    content="Browse the MrObah journal by theme: building in public, creative discipline, personal growth, and reflection."
  />
  <meta name="robots" content="index,follow" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mrobah-theme");
        if (!t) {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="archive">
  <main class="site-shell">
    <nav class="site-nav" aria-label="Primary">
      <a class="brand-title" href="index.html">MrObah</a>
      <ul class="nav-links">
        <li><a data-nav="home" href="index.html">Writing</a></li>
        <li><a data-nav="archive" href="archive.html">Themes</a></li>
        <li><a data-nav="about" href="about.html">About</a></li>
        <li>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch between light and dark mode">
            <span class="icon-moon" aria-hidden="true">&#9790;</span>
            <span class="icon-sun" aria-hidden="true">&#9728;</span>
          </button>
        </li>
      </ul>
    </nav>

    <h1 class="intro-line">Read by thread, not only by date.</h1>

    <div class="browse-bar" style="margin: 0 0 2rem;">
      <div id="archiveFilters" class="tag-filters" aria-label="Filter archive themes"></div>
    </div>
    <p id="archiveInfo" class="results-note" style="margin: 0 0 1.5rem;"></p>

    <section id="archiveGroups" aria-live="polite"></section>

    <footer class="site-footer">
      <p>The archive is built to make recurring thoughts easier to revisit.</p>
      <p><a href="about.html">About the journal</a></p>
    </footer>
  </main>

  <script src="posts-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
