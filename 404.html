<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | MrObah</title>
  <meta name="robots" content="noindex,follow" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mrobah-theme");
        if (!t) {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="not-found">
  <main class="site-shell">
    <div class="lost-page">
      <p class="eyebrow">404</p>
      <h1>This page drifted out of the journal.</h1>
      <p class="intro-line" style="margin: 0;">The note may have moved, or the link arrived incomplete.</p>
      <div class="lost-actions">
        <a class="button-primary" href="index.html">Return home</a>
        <a class="button-quiet" href="archive.html">Browse themes</a>
      </div>
    </div>
  </main>
</body>
</html>
